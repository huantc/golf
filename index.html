<title>Golf Round Manager</title>
<style>
:root{
  --bg:#f4f7f4;--card:#fff;--ink:#1a241e;--muted:#67756d;--green:#153b2a;--green2:#2c6a48;

}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}

header{position:sticky;top:0;z-index:20;background:rgba(244,247,244,.94);backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}

.btn.primary{background:var(--green);color:#fff}.btn.good{background:#e1f3e7;color:#146234}.btn.warn{background:#fff2d8;color:#835500}.btn.bad{background:#fde6e8;color:#9b1f2c}.btn.ghost{background:transparent;border:1px solid var(--line)}

<body>
<div class="app">
<header><div class="brand"><h1>⛳ Golf Round Manager</h1><div id="saveStatus" class="status">Chưa có dữ liệu</div></div></header>
<main>
  <section id="pageRound" class="page active"></section>
  <section id="pageStats" class="page"></section>
  <section id="pageHistory" class="page"></section>
  <section id="pageSettings" class="page"></section>
</main>
</div>
<nav class="tabs"><div class="tabbar">
<button class="tab active" data-tab="Round"><span class="ico">🏌️</span>Round</button>
<button class="tab" data-tab="Stats"><span class="ico">📊</span>Thống kê</button>
<button class="tab" data-tab="History"><span class="ico">🗂️</span>Lịch sử</button>
<button class="tab" data-tab="Settings"><span class="ico">⚙️</span>Cài đặt</button>
</div></nav>
<div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
(() => {
'use strict';
const VERSION=16, STORAGE_KEY='golfRoundManagerV1';
const CLUBS=['Driver','3W','5W','3U','4U','5U','4i','5i','6i','7i','8i','9i','PW','AW','50°','52°','54°','56°','58°','60°','62°','Other'];
const DIRECTIONS=['Thẳng','Trái','Phải'];
const CONTACTS=['Clean','Top','Thin','Fat','Khác'];
const PURPOSES=['Tee','Advance','Approach','Recovery'];
const APPROACH_TYPES=['Pitch','Chip','Bunker','Other'];
const OUTCOMES=[
 {v:'Playable',t:'Playable / vị trí tốt',pen:0},{v:'Green',t:'On green',pen:0},{v:'Fringe',t:'Fringe / vùng an toàn',pen:0},
 {v:'Bunker',t:'Bunker',pen:0},{v:'Trees',t:'Rừng / bị cây chắn',pen:0},{v:'RoughBad',t:'Rough / lie khó',pen:0},
 {v:'OB1',t:'OB – đánh lại (+1)',pen:1},{v:'OB4',t:'OB – 前進4 / プレ4 (tee only, +2)',pen:2},{v:'Penalty',t:'Penalty area / unplayable (+1)',pen:1},{v:'Other',t:'Khác',pen:0}
];
const PLAYABLE_OUTCOMES=['Playable','Green','Fringe'];
const NOUVELLE=[
 [4,344],[3,163],[5,495],[4,381],[5,550],[4,318],[3,133],[4,315],[4,360],
 [4,350],[5,496],[4,343],[3,147],[4,297],[4,375],[3,176],[5,520],[4,390]
];
let currentHole=1, activeTab='Round', statsMode='real', historyMode='real', historyDetailId=null;
let courseEditId=null, courseDraft=null, greenDist=null, osmResults=[];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function defaultState(){return {version:VERSION,currentRoundId:null,rounds:[],courses:[],settings:{clubs:[...CLUBS]}}}
function migrateHole(h){
 h.shots=Array.isArray(h.shots)?h.shots:[]; h.approaches=Array.isArray(h.approaches)?h.approaches:[]; h.putts=Array.isArray(h.putts)?h.putts:[];
 // Keep old purpose=Approach shots as full-swing Approach because older data cannot tell full vs partial reliably.
 h._v4Migrated=true;
 h.shots=h.shots.map((s,i)=>({remaining:(s.remaining!==undefined?s.remaining:(i===0?h.length||'':'')),club:s.club||'',purpose:s.purpose||'Advance',carry:s.carry??'',total:s.total??'',direction:s.direction||'Thẳng',contact:s.contact||'Clean',outcome:s.outcome||'Playable',playable:s.playable!==false,gpsStart:s.gpsStart||null,gpsEnd:s.gpsEnd||null,gpsDistanceYd:s.gpsDistanceYd??''}));
 h.approaches=h.approaches.map(a=>({remaining:a.remaining??'',club:a.club||'50°',type:a.type||'Pitch',carry:a.carry??'',total:a.total??'',direction:a.direction||'Thẳng',contact:a.contact||'Clean',outcome:a.outcome||'Green',playable:a.playable!==false}));
 h.manualPenalty=num(h.manualPenalty); h.notes=h.notes||''; h.strategy=h.strategy||''; h.target=h.target||'';

function clubStats(rounds){
 const map={};

   m.n++;

function gpsAccuracyLabel(v){
 if(v===null||v===undefined)return '';
 if(v<=7)return `GPS tốt • ±${Math.round(v)}m`;
 if(v<=15)return `GPS khá • ±${Math.round(v)}m`;
 return `GPS yếu • ±${Math.round(v)}m`;
}
function bestGpsPosition(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation){reject(new Error('Thiết bị/browser không hỗ trợ GPS.'));return}
  const samples=[]; let watchId=null,finished=false;
  const done=()=>{
   if(finished)return; finished=true;
   if(watchId!==null)navigator.geolocation.clearWatch(watchId);
   clearTimeout(timer);
   if(!samples.length){reject(new Error('Không lấy được vị trí GPS.'));return}
   samples.sort((a,b)=>(a.coords.accuracy||9999)-(b.coords.accuracy||9999));
   resolve(samples[0]);
  };
  const fail=(e)=>{
   if(finished)return;
   if(watchId!==null)navigator.geolocation.clearWatch(watchId);
   clearTimeout(timer); finished=true;
   let msg='Không lấy được GPS.';
   if(e&&e.code===1) msg=window.isSecureContext?'Bạn chưa cho phép truy cập vị trí cho browser.':'GPS bị browser chặn vì app đang mở từ file local. Trên iPhone, hãy chạy app qua HTTPS để dùng GPS ổn định.';
   else if(e&&e.code===2) msg='Không xác định được vị trí. Hãy ra khu vực thoáng hơn rồi thử lại.';
   else if(e&&e.code===3) msg='GPS mất quá nhiều thời gian. Hãy thử lại.';
   reject(new Error(msg));
  };
  const timer=setTimeout(()=>samples.length?done():fail({code:3}),5500);
  try{
   watchId=navigator.geolocation.watchPosition(p=>{
    samples.push(p);
    if((p.coords.accuracy||999)>0 && p.coords.accuracy<=6)done();
    else if(samples.length>=3)done();
   },fail,{enableHighAccuracy:true,maximumAge:0,timeout:5000});
  }catch(e){fail(e)}
 });
}

 }

async function startGpsShot(i){
 const r=currentRound(); if(!r||r.mode!=='real')return;
 const h=r.holes[currentHole-1],s=h.shots[i]; if(!s)return;

 try{
  const p=await bestGpsPosition();
  s.gpsStart=gpsPointFromPosition(p); s.gpsEnd=null; s.gpsDistanceYd='';
  const g=greenGpsFor(r,currentHole);
  if(g)s.remaining=Math.round(gpsDistanceYards(s.gpsStart,g));
  const y=window.scrollY; saveState(); renderRound(); requestAnimationFrame(()=>window.scrollTo(0,y));
  toast(g?`Đã lưu điểm bắt đầu • còn ${s.remaining}y đến green`:`Đã lưu điểm bắt đầu • ±${Math.round(s.gpsStart.accuracy)}m`);
 }catch(e){alert(e.message||'Không lấy được GPS.')}

async function arriveGpsShot(i){

  s.gpsEnd=end; s.gpsDistanceYd=Math.round(yd*10)/10; s.total=Math.round(yd);
  const g=greenGpsFor(r,currentHole);
  if(g){const remYd=gpsDistanceYards(end,g);greenDist={hole:currentHole,yd:remYd,acc:Math.sqrt((num(end.accuracy)||0)**2+(num(g.accuracy)||0)**2)}}
  const y=window.scrollY; saveState(); renderRound(); requestAnimationFrame(()=>window.scrollTo(0,y));

}

const OSM_ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
function osmConnectionHint(){
 let inFrame=false;
 try{inFrame=window.self!==window.top}catch(e){inFrame=true}
 if(inFrame)return 'Có vẻ app đang chạy trong khung xem trước (preview) — khung này chặn mọi truy cập mạng. Hãy tải file về máy rồi mở trực tiếp bằng Safari/Chrome, hoặc đưa app lên HTTPS.';
 if(location.protocol==='file:')return 'App đang mở dạng file local — một số trình duyệt (đặc biệt Safari trên iPhone) chặn gọi mạng từ file local. Cách chắc chắn nhất: đưa app lên hosting HTTPS miễn phí (GitHub Pages, Netlify Drop) — khi đó GPS 📡 cũng chạy được. Trên máy tính, Chrome mở file local thường vẫn gọi được.';
 return 'Kiểm tra kết nối mạng; hoặc máy chủ OpenStreetMap đang quá tải — chờ 1–2 phút rồi thử lại.';
}
async function overpassQuery(ql){
 let lastErr=null;
 for(const url of OSM_ENDPOINTS){
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),30000);
  try{
   const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(ql),signal:ctl.signal});
   if(!res.ok)throw new Error('HTTP '+res.status);
   return await res.json();
  }catch(e){lastErr=(e&&e.name==='AbortError')?new Error('timeout'):e}
  finally{clearTimeout(timer)}
 }
 throw new Error('Không kết nối được OpenStreetMap ('+(lastErr&&lastErr.message||'network')+'). '+osmConnectionHint());
}
function osmEscapeRegex(s){return s.replace(/[.*+?^${}()|[\]\\"]/g,'\\$&')}
async function osmSearchCourses(q){
 const ql=`[out:json][timeout:25];area["ISO3166-1"="JP"][admin_level=2]->.jp;nwr["leisure"="golf_course"]["name"~"${osmEscapeRegex(q)}",i](area.jp);out tags bb 20;`;
 const j=await overpassQuery(ql);
 return (j.elements||[]).map(e=>{
  let b=e.bounds;
  if(!b&&e.lat!==undefined&&e.lon!==undefined)b={minlat:e.lat-.008,minlon:e.lon-.008,maxlat:e.lat+.008,maxlon:e.lon+.008};
  if(!b)return null;
  return {id:e.id,type:e.type,name:(e.tags&&(e.tags.name||e.tags['name:en']))||('OSM '+e.id),nameEn:(e.tags&&e.tags['name:en'])||'',bounds:b};
 }).filter(Boolean);
}
async function osmFetchCourseData(b){
 const pad=0.002, bbox=`${b.minlat-pad},${b.minlon-pad},${b.maxlat+pad},${b.maxlon+pad}`;
 const ql=`[out:json][timeout:60];(way["golf"~"^(hole|green|tee)$"](${bbox});node["golf"~"^(pin|tee)$"](${bbox}););out tags geom;`;
 const j=await overpassQuery(ql);
 const els=j.elements||[];
 return {
  holes:els.filter(e=>e.type==='way'&&e.tags&&e.tags.golf==='hole'&&e.geometry&&e.geometry.length>=2),
  greens:els.filter(e=>e.type==='way'&&e.tags&&e.tags.golf==='green'&&e.geometry&&e.geometry.length>=3),
  tees:els.filter(e=>(e.type==='way'&&e.tags&&e.tags.golf==='tee'&&e.geometry&&e.geometry.length)||(e.type==='node'&&e.tags&&e.tags.golf==='tee')),
  pins:els.filter(e=>e.type==='node'&&e.tags&&e.tags.golf==='pin')
 };
}
function osmCentroid(geom){
 let pts=geom;
 if(pts.length>1&&pts[0].lat===pts[pts.length-1].lat&&pts[0].lon===pts[pts.length-1].lon)pts=pts.slice(0,-1);
 const lat=pts.reduce((a,p)=>a+p.lat,0)/pts.length, lng=pts.reduce((a,p)=>a+p.lon,0)/pts.length;
 return {lat,lng};
}
function osmLineYd(geom){let y=0;for(let i=1;i<geom.length;i++)y+=gpsDistanceYards({lat:geom[i-1].lat,lng:geom[i-1].lon},{lat:geom[i].lat,lng:geom[i].lon});return y}
function osmPoint(o){return o.type==='node'?{lat:o.lat,lng:o.lon}:osmCentroid(o.geometry)}
function osmNearest(p,arr,maxYd){
 let best=null,bd=Infinity;
 arr.forEach(o=>{const d=gpsDistanceYards(p,osmPoint(o));if(d<bd){bd=d;best=o}});
 return best&&bd<=maxYd?best:null;
}
function osmApplyToDraft(data){
 const c=courseDraft; if(!c)return {holes:0,greens:0,tees:0,pars:0};
 const teeCol=c.tees[0]||'Regular';
 let nH=0,nG=0,nT=0,nP=0;
 data.holes.forEach(w=>{
  const ref=parseInt(w.tags.ref,10); if(!(ref>=1&&ref<=18))return;
  const h=c.holes[ref-1], g=w.geometry;
  const start={lat:g[0].lat,lng:g[0].lon}, end={lat:g[g.length-1].lat,lng:g[g.length-1].lon};
  nH++;
  if(num(w.tags.par)){h.par=num(w.tags.par);nP++}
  const len=Math.round(osmLineYd(g)); if(len>50)h.lengths[teeCol]=len;
  const gr=osmNearest(end,data.greens,90);
  let gp=gr?osmPoint(gr):end;
  const pin=osmNearest(gp,data.pins,45); if(pin)gp=osmPoint(pin);
  h.greenGps={lat:gp.lat,lng:gp.lng,accuracy:0,ts:Date.now()}; nG++;
  const te=osmNearest(start,data.tees,70);
  const tp=te?osmPoint(te):start;
  h.teeGps={lat:tp.lat,lng:tp.lng,accuracy:0,ts:Date.now()}; nT++;
 });
 data.greens.forEach(gr=>{
  const ref=parseInt(gr.tags&&gr.tags.ref,10); if(!(ref>=1&&ref<=18))return;
  const h=c.holes[ref-1]; if(h.greenGps)return;
  const p=osmPoint(gr); h.greenGps={lat:p.lat,lng:p.lng,accuracy:0,ts:Date.now()}; nG++;
 });
 return {holes:nH,greens:nG,tees:nT,pars:nP};
}

function requestDeleteRound(id){
 const r=state.rounds.find(x=>x.id===id); if(!r)return;
 openModal(`<h3>Xóa round?</h3>
  <div class="note" style="margin-bottom:12px"><b>${esc(r.course)}</b><br>${esc(r.date)} • ${esc(r.tee)} • ${modeLabel(r.mode)}</div>
  <div class="small" style="margin-bottom:14px">Round sẽ bị xóa khỏi dữ liệu trên thiết bị. Hành động này không thể hoàn tác nếu chưa Export backup.</div>
  <div class="row"><button class="btn grow" onclick="app.closeModal()">Hủy</button><button class="btn bad grow delete-confirm" onclick="app.confirmDeleteRound('${id}')">Xóa round</button></div>`);
}
function confirmDeleteRound(id){
 const idx=state.rounds.findIndex(r=>r.id===id);
 if(idx<0){closeModal();toast('Round không còn tồn tại');return}
 state.rounds.splice(idx,1);
 if(state.currentRoundId===id) state.currentRoundId=state.rounds[0]?.id||null;
 if(historyDetailId===id) historyDetailId=null;
 saveState();
 closeModal();
 renderRound();renderStats();renderHistory();renderSettings();
 switchTab(activeTab,false);
 toast('Đã xóa round');
}

const app={
 switchTab,closeModal,openNewRound,editRoundMeta,editHoleMeta,openAddShotModal,openAddApproachModal,startGpsShot,arriveGpsShot,clearGpsShot,requestDeleteRound,confirmDeleteRound,
 openCourseEditor,cancelCourseEdit,saveCourse,captureCourseGps,manualCourseGps,clearCourseGps,requestDeleteCourse,confirmDeleteCourse,measureToGreen,useTeeStart,
 cSetName(v){if(courseDraft)courseDraft.name=v},
 cSetTees(v){if(!courseDraft)return;const tees=v.split(',').map(x=>x.trim()).filter(Boolean);courseDraft.tees=tees.length?tees:['Regular'];const y=window.scrollY;renderSettings();requestAnimationFrame(()=>window.scrollTo(0,y))},
 cSet(i,f,v){if(courseDraft)courseDraft.holes[i][f]=f==='par'?(num(v)||''):v},
 cSetLen(i,ti,v){if(!courseDraft)return;const t=courseDraft.tees[ti];if(t===undefined)return;courseDraft.holes[i].lengths[t]=v===''?'':num(v)},
 async osmSearch(){
  const q=(document.getElementById('osmQ')?.value||'').trim();
  if(q.length<2){toast('Nhập tên sân (từ 2 ký tự)');return}
  const box=document.getElementById('osmResults');
  if(box)box.innerHTML='<div class="small" style="padding:6px 2px">Đang tìm trên OpenStreetMap…</div>';
  try{
   osmResults=await osmSearchCourses(q);
   if(box)box.innerHTML=osmResults.length?osmResults.map((r,i)=>`<button type="button" class="btn ghost course-result" onclick="app.osmPick(${i})"><b>${esc(r.name)}</b><br><span class="small">OpenStreetMap • ${r.type}/${r.id}${r.nameEn?` • ${esc(r.nameEn)}`:''}</span></button>`).join(''):'<div class="small" style="padding:6px 2px">Không tìm thấy sân này trên OSM. Thử từ khóa ngắn hơn hoặc tên tiếng Nhật; nếu vẫn không có, sân chưa được vẽ trên OSM — dùng 📡/✎ bên dưới.</div>';
  }catch(e){if(box)box.innerHTML=`<div class="gps-warning">${esc(e.message)}</div>`}
 },
 async osmPick(i){
  const r=osmResults[i]; if(!r||!courseDraft)return;
  toast('Đang tải hố/green/tee từ OSM…');
  try{
   const data=await osmFetchCourseData(r.bounds);
   if(!(courseDraft.name||'').trim())courseDraft.name=r.name;
   const s=osmApplyToDraft(data);
   const y=window.scrollY;renderSettings();requestAnimationFrame(()=>window.scrollTo(0,y));
   if(!s.holes&&!s.greens)alert('Sân này có trên OSM nhưng chưa được vẽ chi tiết hố/green/tee.\nBạn có thể tự vẽ đóng góp tại openstreetmap.org (dùng ảnh nền được phép), hoặc đăng ký bằng 📡/✎.');
   else alert(`Đã điền từ OSM:\n• ${s.holes} hố (đường chơi)\n• ${s.pars} hố có Par\n• ${s.greens} Green GPS\n• ${s.tees} Tee GPS\n\nChiều dài hố đo theo đường chơi trên bản đồ, điền vào tee "${courseDraft.tees[0]}". Hãy đối chiếu scorecard chính thức và chỉnh lại nếu lệch.`);
  }catch(e){alert(e.message||'Không tải được dữ liệu OSM.')}
 },
 setStatsMode(m){statsMode=m;renderStats()},setHistoryMode(m){historyMode=m;historyDetailId=null;renderHistory()},
 filterCourseTemplates(q){const el=document.getElementById('courseResults');if(el)el.innerHTML=courseResultHtml(q)},
 selectCourseTemplate(token){
  const hidden=document.getElementById('nrTemplateId'),course=document.getElementById('nrCourse'),search=document.getElementById('courseSearch');
  const setTeeInput=v=>{const w=document.getElementById('nrTeeWrap');if(w)w.innerHTML=`<label>Tee</label><input id="nrTee" value="${esc(v)}">`};
  if(!hidden||!course)return; hidden.value=token;
  if(token==='preset:nouvelle'){course.value='Nouvelle Golf Club';setTeeInput('Regular');if(search)search.value='Nouvelle Golf Club'}
  else if(token.startsWith('course:')){const c=state.courses.find(x=>x.id===token.slice(7));if(c){course.value=c.name;if(search)search.value=c.name;const w=document.getElementById('nrTeeWrap');if(w)w.innerHTML=`<label>Tee</label><select id="nrTee">${c.tees.map(t=>`<option>${esc(t)}</option>`).join('')}</select>`}}
  else if(token.startsWith('round:')){const r=state.rounds.find(x=>x.id===token.slice(6));if(r){course.value=r.course;setTeeInput(r.tee||'Regular');if(search)search.value=r.course}}
  toast('Đã chọn sân')},
 onCourseNameInput(){const hidden=document.getElementById('nrTemplateId');if(!hidden)return;hidden.value='';const t=document.getElementById('nrTee');if(t&&t.tagName==='SELECT'){const w=document.getElementById('nrTeeWrap');if(w)w.innerHTML='<label>Tee</label><input id="nrTee" value="Regular">'}},
 createRound(){const token=document.getElementById('nrTemplateId').value,name=document.getElementById('nrCourse').value.trim()||'Round mới',date=document.getElementById('nrDate').value,tee=document.getElementById('nrTee').value.trim()||'Regular',mode=document.getElementById('nrMode').value||'real';let r;if(token==='preset:nouvelle')r=makeRound(name,date,tee,'nouvelle',mode);else if(token.startsWith('course:')){const c=state.courses.find(x=>x.id===token.slice(7));r=c?makeRoundFromCourse(c,name,date,tee,mode):makeRound(name,date,tee,'blank',mode)}else if(token.startsWith('round:')){const src=state.rounds.find(x=>x.id===token.slice(6));r=src?makeRoundFromTemplate(src,name,date,tee,mode):makeRound(name,date,tee,'blank',mode)}else r=makeRound(name,date,tee,'blank',mode);state.rounds.push(r);state.currentRoundId=r.id;currentHole=1;saveState();closeModal();render();toast('Đã tạo round')},
 saveRoundMeta(){const r=currentRound();if(!r)return;r.course=document.getElementById('rmCourse').value.trim()||'Round mới';r.date=document.getElementById('rmDate').value||today();r.tee=document.getElementById('rmTee').value.trim()||'Regular';r.mode=document.getElementById('rmMode').value||'real';saveState();closeModal();render();toast('Đã cập nhật round')},
 goHole(n){if(n<1||n>18)return;currentHole=n;greenDist=null;renderRound();window.scrollTo(0,0)},
 addFullInline(){const h=currentRound().holes[currentHole-1],club=h.shots.length===0&&state.settings.clubs.includes('Driver')?'Driver':(state.settings.clubs.includes('7i')?'7i':state.settings.clubs[0]||'Other');h.shots.push({remaining:'',club,purpose:h.shots.length===0?'Tee':'Advance',carry:'',total:'',direction:'Thẳng',contact:'Clean',outcome:'Playable',playable:true,gpsStart:null,gpsEnd:null,gpsDistanceYd:''});const y=window.scrollY;saveState();renderRound();requestAnimationFrame(()=>window.scrollTo(0,y))},
 addApproachInline(){const h=currentRound().holes[currentHole-1],club=state.settings.clubs.includes('50°')?'50°':state.settings.clubs[0]||'Other';h.approaches.push({remaining:'',club,type:'Pitch',carry:'',total:'',direction:'Thẳng',contact:'Clean',outcome:'Green',playable:true});const y=window.scrollY;saveState();renderRound();requestAnimationFrame(()=>window.scrollTo(0,y))},
 setHole(k,v){const h=currentRound().holes[currentHole-1];h[k]=k==='manualPenalty'?num(v):v;saveState()},
 saveHoleMeta(){const h=currentRound().holes[currentHole-1];h.par=num(document.getElementById('hmPar').value)||4;h.length=num(document.getElementById('hmLen').value)||'';h.target=document.getElementById('hmTarget').value;h.strategy=document.getElementById('hmStrategy').value;saveState();closeModal();renderRound()},
 removeShot(i){currentRound().holes[currentHole-1].shots.splice(i,1);saveState();renderRound()},
 setShot(i,k,v){const s=currentRound().holes[currentHole-1].shots[i];s[k]=['carry','total'].includes(k)?(v===''?'':num(v)):v;if(k==='outcome'&&!PLAYABLE_OUTCOMES.includes(v)){s.carry='';s.total='';s.gpsEnd=null;s.gpsDistanceYd=''}saveState();renderRound()},
 removeApproach(i){currentRound().holes[currentHole-1].approaches.splice(i,1);saveState();renderRound()},
 setApproach(i,k,v){const a=currentRound().holes[currentHole-1].approaches[i];a[k]=v;saveState();renderRound()},
 addPutt,removePutt(i){const ps=currentRound().holes[currentHole-1].putts;ps.splice(i,1);if(ps.length)ps[ps.length-1].made=true;saveState();renderRound()},
 setPutt(i,k,v){currentRound().holes[currentHole-1].putts[i][k]=k==='distance'?(v===''?'':num(v)):v;saveState()},
 openHistoryRound(id){historyDetailId=id;renderHistory();setTimeout(()=>window.scrollTo({top:0}),0)},closeHistoryDetail(){historyDetailId=null;renderHistory()},
 editHistoricalRound(id){state.currentRoundId=id;currentHole=1;historyDetailId=null;saveState();switchTab('Round');render();setTimeout(()=>window.scrollTo({top:0}),0)},
 loadRound(id){this.editHistoricalRound(id)},
 duplicateRound(id){const old=state.rounds.find(r=>r.id===id);if(!old)return;const nr=JSON.parse(JSON.stringify(old));nr.id=uid();nr.date=today();nr.createdAt=new Date().toISOString();nr.holes.forEach(h=>{h.shots=[];h.approaches=[];h.putts=[];h.manualPenalty=0;h.notes='';h._v4Migrated=true});state.rounds.push(nr);state.currentRoundId=nr.id;saveState();historyDetailId=null;render();toast('Đã tạo round mới từ course cũ')},
 deleteRound(id){requestDeleteRound(id)},
 exportRound(){const r=currentRound();if(!r)return toast('Chưa có round');download(`golf_${r.date}_${r.course.replace(/[^a-z0-9]+/gi,'_')}.json`,exportPayload(r))},exportSpecific(id){const r=state.rounds.find(x=>x.id===id);if(r)download(`golf_${r.date}_${r.course.replace(/[^a-z0-9]+/gi,'_')}.json`,exportPayload(r))},exportAll(){download(`golf_round_manager_backup_${today()}.json`,{app:'Golf Round Manager',version:VERSION,exportedAt:new Date().toISOString(),data:state})},
 async shareRound(){const r=currentRound();if(!r)return toast('Chưa có round');const payload=JSON.stringify(exportPayload(r),null,2),file=new File([payload],`golf_${r.date}.json`,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Golf round data',text:`${r.course} ${r.date}`,files:[file]})}else download(file.name,exportPayload(r))}catch(e){if(e.name!=='AbortError')download(file.name,exportPayload(r))}},
 importFile(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(x.data&&x.data.rounds){if(!confirm('Import backup sẽ thay dữ liệu hiện tại. Tiếp tục?'))return;Object.assign(state,x.data);state.rounds=(state.rounds||[]).map(migrateRound);state.courses=(x.data.courses||[]).map(migrateCourse)}else if(x.round){const r=migrateRound(x.round);r.id=uid();state.rounds.push(r);state.currentRoundId=r.id}else throw new Error('format');state.version=VERSION;saveState();render();toast('Import thành công')}catch(e){alert('File JSON không đúng định dạng Golf Round Manager.')}};rd.readAsText(file)},
 saveClubs(){state.settings.clubs=document.getElementById('clubEditor').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);saveState();render();toast('Đã lưu danh sách gậy')},resetAll(){if(!confirm('Xóa TOÀN BỘ round và cài đặt?'))return;localStorage.removeItem(STORAGE_KEY);location.reload()}
};
window.app=app;document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));render();
})();

</script>
